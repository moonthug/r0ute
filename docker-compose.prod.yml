# production deployment using the images CI pushes to GHCR
#
#   docker compose -f docker-compose.prod.yml up -d
#
# replace <owner> with the github owner of this repo (images are pushed to
# ghcr.io/<owner>/r0ute/{bot,admin,web} by .github/workflows/ci.yml)
services:
  bot:
    image: ghcr.io/<owner>/r0ute/bot:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    # lets the non-root `node` user open the serial device
    group_add:
      - dialout
    environment:
      DEVICE: /dev/ttyUSB0
      DATABASE_URL: postgresql://r0ute:${POSTGRES_PASSWORD:-r0ute}@postgres:5432/r0ute
      LOG_LEVEL: info
      # public URL of the web service below — shared in path reply messages
      BASE_URL: ${BASE_URL:-http://localhost:3100/p}
      # optional MeshRank observer uplink (https://meshrank.net) — set the IATA
      # code of your region to enable; defaults to the public broker
      # MESHRANK_IATA: MAN
      # MESHRANK_MQTT_URL: mqtts://meshrank.net:8883

  admin:
    image: ghcr.io/<owner>/r0ute/admin:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # the bot applies database migrations on startup
      bot:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://r0ute:${POSTGRES_PASSWORD:-r0ute}@postgres:5432/r0ute

  web:
    image: ghcr.io/<owner>/r0ute/web:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # the bot applies database migrations on startup
      bot:
        condition: service_started
    ports:
      - "3100:3000"
    environment:
      DATABASE_URL: postgresql://r0ute:${POSTGRES_PASSWORD:-r0ute}@postgres:5432/r0ute

  postgres:
    image: imresamu/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: r0ute
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-r0ute}
      POSTGRES_DB: r0ute
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r0ute -d r0ute"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
